  <button id="infoToggle" type="button" data-chaos-exclude>INFO</button>

      <button class="info-close" type="button">✕</button>
      <h2 class="info-title"></h2>
      <div class="info-description"></div>
      <div class="info-ref"></div>

            <a href="../zone-01/zone-01.html" class="mini-zone mini-zone-1"  data-mini-zone="1"  data-zone-name="Poster"><span class="mobile-zone-hint"></span></a>

            <a href="../zone-03/zone-03.html" class="mini-zone mini-zone-3"  data-mini-zone="3"  data-zone-name="Anthropomorph"><span class="mobile-zone-hint"></span></a>

  <!-- Tooltip raccourcis (chaos) -->

  <!-- ═══════════════════════════
       SCRIPTS
       Ordre : données → ui commune → chaos → module zone
       ═══════════════════════════ -->

  <script src="../pannel-ui.js"></script>

  <!-- chaos-mode : doit être chargé avant zone-13.js
       pour que window.EC_CHAOS existe quand le module s'initialise -->
  <script src="../chaos-mode.js"></script>

  <!-- Tooltip à l'activation chaos -->
  <script>
    (function () {
      const tip = document.getElementById('ecChaosShortcuts');
      if (!tip) return;
      document.addEventListener('ec-chaos:on', () => {
        tip.classList.add('is-visible');
        setTimeout(() => tip.classList.remove('is-visible'), 3400);
      });
    })();
  </script>
